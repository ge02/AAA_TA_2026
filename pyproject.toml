[project]
name = "assignment-template" # REPLACE
version = "0.1.0" # submission version must be 1.0.0
description = "Quarto template for IS3 team project reports" # REPLACE
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ipykernel>=6.20.0",
    "pyyaml>=6.0.0",
    "jupyter>=1.0.0",
    "scipy>=1.15.3",
    "geopandas>=1.1.3",
    "sodapy>=2.2.0",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.1",
    "retry-requests>=2.0.0",
    "h3>=4.4.2",
    "scikit-learn>=1.3.0",
    "folium>=0.15.1",
    "scikit-learn>=1.7.2",
    "contextily>=1.7.0",
    "holidays>=0.97",
    "shapely>=2.1.2",
    "pyarrow>=24.0.0",
    "simpy>=4.1.2",
    "gymnasium>=1.3.0",
]

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "nbdime>=4.0.4",
]
